[project]
name = "whittling-planner"
version = "0.1.0"
description = "Plan a whittling project: pick a block and a design, get a staged carving plan with 3D views and marking-out measurements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "numpy>=2.5.4",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
whittling-planner = "whittling_planner.cli:main"
whittling-planner-web = "whittling_planner.web.server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
